version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: competitive_pricing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d competitive_pricing"]
      interval: 10s
      timeout: 5s
      retries: 5

  pricing-agent:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=competitive_pricing
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    command: python main.py
    restart: unless-stopped

volumes:
  postgres_data: